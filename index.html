<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cat Flappy - Mobile Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="mobileControls">
            <button id="jumpBtn" class="control-btn">Jump</button>
            <div id="menuButtons">
                <button id="leaderboardBtn" class="menu-btn">Leaderboard</button>
                <button id="switchPlayerBtn" class="menu-btn">Switch Player</button>
                <button id="restartBtn" class="menu-btn">Restart</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
